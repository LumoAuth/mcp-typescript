# Envoy HTTP `ext_authz` filter configuration for `npx lumoauth ext-authz`
# Buffers up to 64 KiB of JSON-RPC request bodies (`with_request_body`) so LumoAuth
# can enforce per-tool Zanzibar policies and JIT/RAR step-up on `tools/call`,
# and injects verified `x-lumoauth-*` and `traceparent` headers upstream while
# stripping client `authorization` and `dpop` headers.
static_resources:
  listeners:
    - name: mcp_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mcp_ingress
                route_config:
                  name: mcp_routes
                  virtual_hosts:
                    - name: mcp_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/.well-known/"
                          route:
                            cluster: lumoauth_ext_authz
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match:
                            prefix: "/"
                          route:
                            cluster: mcp_upstream
                            request_headers_to_remove:
                              - "authorization"
                              - "dpop"
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      with_request_body:
                        max_request_bytes: 65536
                        allow_partial_message: true
                      http_service:
                        server_uri:
                          uri: http://127.0.0.1:9001
                          cluster: lumoauth_ext_authz
                          timeout: 5s
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: "authorization"
                              - exact: "dpop"
                              - exact: "traceparent"
                              - exact: "x-lumoauth-jit-token"
                              - exact: "content-type"
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - prefix: "x-lumoauth-"
                              - exact: "traceparent"
                          allowed_client_headers:
                            patterns:
                              - exact: "www-authenticate"
                              - exact: "insufficient-authorization-details"
                              - exact: "x-lumoauth-denied-tool"
                              - exact: "content-type"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: lumoauth_ext_authz
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: lumoauth_ext_authz
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 9001
    - name: mcp_upstream
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: mcp_upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8000
